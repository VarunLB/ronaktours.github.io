<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronak Tours & Travels</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f2f2f2; }
        header { background: #003399; color: white; text-align: center; padding: 25px; }
        header img { width: 80px; }
        .container { padding: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        button { width: 100%; padding: 12px; background: #00802b; color: white; border: none; font-size: 18px; border-radius: 6px; cursor: pointer; }
        button:hover { background: #005c20; }
        select, input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid gray; margin-top: 8px; }
        .bus-info { background: #f9f9f9; padding: 10px; border-left: 4px solid #003399; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <h2>Ronak Tours & Travels</h2>
    <p>Search Bus | Ticket Inquiry | Group Booking</p>
</header>

<div class="container">

    <div class="card">
        <h3>Search Bus</h3>
        <label>From:</label>
        <select id="from">
            <option>Deesa</option>
        </select>

        <label>To:</label>
        <select id="to">
            <option>Mumbai</option>
            <option>Dwarka</option>
            <option>Jodhpur</option>
            <option>Ajmer</option>
            <option>Jaipur</option>
            <option>Delhi</option>
        </select>

        <label>Date:</label>
        <input type="date" id="date">

        <button onclick="searchBus()">Search Bus</button>

        <div id="result"></div>
    </div>

    <div class="card">
        <h3>Group / Marriage / Picnic Bus Booking</h3>
        <button onclick="window.location.href='https://wa.me/919429286586?text=I want to book a bus for Group/Marriage/Picnic'">Send Inquiry on WhatsApp</button>
    </div>

</div>

<script>
function searchBus() {
    const to = document.getElementById('to').value;
    const date = document.getElementById('date').value;

    if (!date) { alert("Please select journey date"); return; }

    const busData = {
        "Mumbai": { time: "6:30 PM", fare: "₹1200" },
        "Dwarka": { time: "7:00 PM", fare: "₹800" },
        "Jodhpur": { time: "8:00 PM", fare: "₹700" },
        "Ajmer": { time: "7:30 PM", fare: "₹900" },
        "Jaipur": { time: "6:45 PM", fare: "₹1100" },
        "Delhi": { time: "5:45 PM", fare: "₹1500" }
    };

    const bus = busData[to];
    document.getElementById('result').innerHTML = `
        <div class="bus-info">
            <p><b>Route:</b> Deesa → ${to}</p>
            <p><b>Time:</b> ${bus.time}</p>
            <p><b>Fare:</b> ${bus.fare}</p>
            <button onclick="window.location.href='https://wa.me/919429286586?text=Inquiry for Deesa to ${to} on ${date} — Timing: ${bus.time}, Fare: ${bus.fare}'">Book on WhatsApp</button>
        </div>
    `;
}
</script>

</body>
</html>
